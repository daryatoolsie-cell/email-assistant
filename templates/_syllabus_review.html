    <!-- Syllabus review (step 2 of adding from a syllabus) -->
    <section class="panel hidden" id="syllabus-review">
      <h2>Review syllabus: <span id="sr-filename"></span></h2>
      <p class="muted small">Claude filled this in from the syllabus. Check it, fix anything that's wrong, then click <strong>Save</strong>.
        Items marked ⚠️ have no exact date in the syllabus. Add one if you know it.</p>

      <label>Save to
        <select id="sr-target"></select>
      </label>
      <div class="grid">
        <label>Professor name <input id="sr-name"></label>
        <label>Email <input id="sr-email" type="email" placeholder="Not in the syllabus. Please add it"></label>
        <label>Course (short label) <input id="sr-course"></label>
        <label>Notes (optional) <input id="sr-notes" placeholder="e.g. Prefers Dr. Smith"></label>
      </div>

      <details class="sr-details">
        <summary>Class details (office hours, grading, policies…)</summary>
        <div class="grid">
          <label>Office hours <textarea id="sr-office_hours" rows="2"></textarea></label>
          <label>Class times <textarea id="sr-class_times" rows="2"></textarea></label>
          <label>Course title <input id="sr-course_title"></label>
          <label>Term <input id="sr-term"></label>
          <label>Location <input id="sr-location"></label>
          <label>TAs <input id="sr-teaching_assistants"></label>
          <label>Grading <textarea id="sr-grading" rows="3"></textarea></label>
          <label>Key policies <textarea id="sr-policies" rows="3"></textarea></label>
        </div>
      </details>

      <h2 class="spaced">Exams &amp; assignments <span class="muted small" id="sr-count"></span></h2>
      <div id="sr-items"></div>
      <button type="button" class="link" id="sr-add-item">+ Add an item</button>

      <p id="sr-error" class="error hidden"></p>
      <div class="row">
        <button id="sr-save">Save</button>
        <button class="secondary" id="sr-cancel">Cancel</button>
      </div>
    </section>
