# Builds the Mac app on GitHub's Mac computers.
#  - Every push to main builds and tests it (download it from the run's "Artifacts").
#  - When the number in the VERSION file is new (no release for it yet), it's also
#    published on the Releases page for friends. To publish an update: change VERSION.
name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases

jobs:
  build:
    runs-on: macos-latest  # Apple Silicon (M1 and newer Macs)
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and check whether it's already released
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Version $VERSION is already released: building and testing only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION is new: it will be published."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-app.txt

      - name: Add the Google client file (optional)
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_JSON" ]; then
            printf '%s' "$GOOGLE_CLIENT_JSON" > packaging/google_client.json
            python -c "import json; assert 'installed' in json.load(open('packaging/google_client.json')), 'GOOGLE_CLIENT_JSON must be a Desktop app client'"
            echo "Google client bundled: people can click Connect Gmail directly."
          else
            echo "No GOOGLE_CLIENT_JSON secret: each person adds their own credentials file for Gmail."
          fi

      - name: Make the app icon
        run: |
          python packaging/make_icon.py
          mkdir -p packaging/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/icon.png --out packaging/icon.iconset/icon_${s}x${s}.png > /dev/null
            sips -z $((s*2)) $((s*2)) packaging/icon.png --out packaging/icon.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns packaging/icon.iconset -o packaging/icon.icns

      - name: Build the app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: pyinstaller --noconfirm packaging/EmailAssistant.spec

      - name: Test the built app
        run: |
          "dist/Email Assistant.app/Contents/MacOS/Email Assistant" --selftest
          cat "$HOME/Library/Application Support/Email Assistant/app.log"
          grep -q "SELFTEST OK" "$HOME/Library/Application Support/Email Assistant/app.log"

      - name: Zip the app
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent "Email Assistant.app" Email-Assistant-Mac.zip

      - name: Keep the zip as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Email-Assistant-Mac
          path: dist/Email-Assistant-Mac.zip

      - name: Publish the download (new versions only)
        if: github.ref == 'refs/heads/main' && steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Email Assistant ${{ steps.version.outputs.version }}
          files: dist/Email-Assistant-Mac.zip
          body_path: INSTALL.md
          make_latest: true
